name: Build APK

# Jalan otomatis setiap ada push ke branch main/master,
# dan bisa dipicu manual lewat tab "Actions" di GitHub.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Ambil dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Unggah APK sebagai hasil build
        uses: actions/upload-artifact@v4
        with:
          name: toko-sembako-apk
          path: build/app/outputs/flutter-apk/app-release.apk
