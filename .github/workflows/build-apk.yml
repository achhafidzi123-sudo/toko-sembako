name: Build APK

# Jalan otomatis setiap ada push ke branch main/master,
# dan bisa dipicu manual lewat tab "Actions" di GitHub.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.27.1"

      - name: Buat folder Android (project awal belum menyertakannya)
        run: flutter create --platforms=android --org com.tokosembako --project-name toko_sembako .

      - name: Perbaiki compileSdkVersion untuk semua plugin
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 35
                          if (project.android.hasProperty("ndkVersion")) {
                              ndkVersion "27.0.12077973"
                          }
                      }
                  }
              }
          }
          EOF

      - name: Ambil dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Unggah APK sebagai hasil build
        uses: actions/upload-artifact@v4
        with:
          name: toko-sembako-apk
          path: build/app/outputs/flutter-apk/app-release.apk
